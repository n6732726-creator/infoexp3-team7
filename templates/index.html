<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>MiniBoard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <main>
        <h1>MiniBoard</h1>
        <p>チームで育てる大きなWebアプリ</p>
        <form id="form"><input id="name" maxlength="30" placeholder="Nickname" required><textarea id="message"
                maxlength="300" placeholder="Message" required></textarea><button>投稿</button></form>
        <p id="status"></p>
        <section id="messages"></section>
    </main>
    <script src="/static/app.js"></script>
</body>

<form id="post-form">
  <input type="text" id="name-input" placeholder="名前" required>
  <textarea id="message-input" placeholder="いまどうしてる？" required></textarea>
  
  <div class="form-footer">
    <!-- 文字数カウンター用の要素 -->
    <span id="char-counter"><span id="char-count">0</span> / 140文字</span>
    <button type="submit">投稿する</button>
  </div>
</form>

</html>
