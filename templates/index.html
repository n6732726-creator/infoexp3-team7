<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>MiniBoard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <main>
        <h1>MiniBoard</h1>
        <p>チームで育てる大きなWebアプリ</p>
        <form id="form">
            <input id="name" maxlength="30" placeholder="Nickname" required>
            <textarea id="message" maxlength="300" placeholder="Message" required></textarea>
    
            <!-- ここに文字数カウンターを追加 -->
            <div style="text-align: right; font-size: 0.9rem; color: #666; margin-bottom: 8px;">
                <span id="char-count">0</span> / 300文字
            </div>

    <button>投稿</button>
</form>
        <p id="status"></p>
        <section id="messages"></section>
    </main>
    <script src="/static/app.js"></script>
</body>

</html>
